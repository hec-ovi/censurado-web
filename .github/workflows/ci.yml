name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: censurado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Makes the Postgres conformance suite run (it skips when unset), so the
      # store-swap abstraction is proven green on every push.
      CENSURADO_TEST_POSTGRES_DSN: postgres://postgres:pass@localhost:5432/censurado?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  js:
    # Tier-B client refiner suite (Vitest + Testing Library + MSW, jsdom). Gates
    # every push alongside the Go generator suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npx vitest run
