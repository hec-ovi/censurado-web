# =============================================================================
# Censurado self-hosting topology (Phase 6B)
#
# Single-writer sqlite. Three Go binaries share ONE database file on the db-data
# volume:
#   - publish  : the ONLY writer. Serves the authenticated write API (POST
#                /articles + GET /healthz). Creates and writes /data/censurado.db.
#   - admin    : a READER. The private operator console (/admin/*). It only writes
#                the db when an operator triggers a regenerate of the static site.
#   - generate : a READER. One-shot static site generator (run on demand).
#
# The database runs in WAL mode (set in the sqlite DSN), which lets the readers run
# concurrently with the single writer. NOTE: the db-data volume is mounted READ-WRITE
# for all three services on purpose. WAL readers must be able to create/update the
# -wal and -shm sidecar files, so a ":ro" mount would break them. Only publish writes
# article data; admin/generate are logical readers.
#
# Private by default: the publish API and the admin console are off the public
# internet. Their host ports are bound to 127.0.0.1 only (see the port mappings), so
# nothing is reachable from 0.0.0.0. The binaries bind 0.0.0.0 INSIDE the container
# (set in each image CMD) so they are reachable across the compose network; the
# 127.0.0.1 host mapping is what restricts real exposure. Reach them over an SSH
# tunnel or a private network.
#
# The only public surface is the generated static site on the site-data volume, plus
# the uploaded images on the media-data volume. Both are served by an external CDN or
# web server (Nginx, Caddy, a CDN origin, ...) that is NOT part of this compose: point
# that server at the site-data volume for / and the media-data volume for /media/ (or
# sync them out), and keep this compose private. Article HTML references images as
# root-relative /media/... URLs, so /media/ must be served from the same public origin.
#
# Secrets/config come from deploy/.env (see .env.example). Fixed internal paths are
# set per-service below.
# =============================================================================

services:
  # --- publish: the write API, the ONLY db writer ----------------------------
  publish:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.publish
    image: censurado-publish:dev
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed internal paths (not secrets). The keys file is mounted read-only below.
      CENSURADO_DB: /data/censurado.db
      CENSURADO_PUBLISH_KEYS_FILE: /etc/censurado/keys.json
      # The self-hosted image store / CDN. publish writes uploaded images here (POST
      # /media) and serves them (GET /media/{name}); the public web server below also
      # serves /media/ straight from this same volume. Leave unset to disable media.
      CENSURADO_MEDIA_DIR: /srv/media
    ports:
      # Private: bound to localhost on the host. The container listens on 0.0.0.0:8080.
      - "127.0.0.1:8080:8080"
    volumes:
      - db-data:/data
      - media-data:/srv/media
      # Seed this as an empty JSON array FIRST (`printf '[]\n' > keys.json`) before
      # any `compose run`: Docker creates an empty DIRECTORY here if the host file is
      # missing, which breaks the documented first-run. Then mint entries with
      # `docker compose run --rm publish -gen-key -author NAME` and replace the [].
      - ./keys.json:/etc/censurado/keys.json:ro
    read_only: true
    # These are pure-Go HTTP servers binding ports >1024 as the distroless nonroot
    # user: they need zero Linux capabilities. Drop the default set and forbid
    # privilege escalation to shrink the post-compromise blast radius.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- admin: the private operator console, a db reader ----------------------
  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    image: censurado-admin:dev
    restart: unless-stopped
    # depends_on so publish initializes the db-data volume (and its ownership) first.
    depends_on:
      - publish
    env_file: .env
    environment:
      CENSURADO_DB: /data/censurado.db
      # Out dir for the in-console "regenerate" action; writes the static site volume.
      CENSURADO_ADMIN_OUT: /site
      # The manual "New article" form POSTs to the publish service over the compose
      # network, so the admin stays a NON-WRITER of the db (publish remains the only
      # writer). The operator token (CENSURADO_ADMIN_PUBLISH_TOKEN) comes from .env;
      # leave it blank there to disable the create form.
      CENSURADO_ADMIN_PUBLISH_URL: http://publish:8080
      # CENSURADO_BASE_URL, CENSURADO_ADMIN_TOKEN_HASH, CENSURADO_ADMIN_SESSION_KEY,
      # CENSURADO_ADMIN_SECURE_COOKIES, and CENSURADO_ADMIN_PUBLISH_TOKEN come from .env.
    ports:
      # Private: bound to localhost on the host. The container listens on 0.0.0.0:8081.
      - "127.0.0.1:8081:8081"
    volumes:
      - db-data:/data
      - site-data:/site
    read_only: true
    # These are pure-Go HTTP servers binding ports >1024 as the distroless nonroot
    # user: they need zero Linux capabilities. Drop the default set and forbid
    # privilege escalation to shrink the post-compromise blast radius.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- generate: one-shot static site builder, a db reader -------------------
  # On-demand only (profiles: build). Run a batch with:
  #   docker compose run --rm generate
  generate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.generate
    image: censurado-generate:dev
    profiles: ["build"]
    restart: "no"
    env_file: .env
    environment:
      CENSURADO_DB: /data/censurado.db
      # CENSURADO_BASE_URL comes from .env. The image CMD passes -out /site.
    volumes:
      - db-data:/data
      - site-data:/site
    read_only: true
    # These are pure-Go HTTP servers binding ports >1024 as the distroless nonroot
    # user: they need zero Linux capabilities. Drop the default set and forbid
    # privilege escalation to shrink the post-compromise blast radius.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # --- litestream: continuous backup sidecar (Phase 6C) ----------------------
  # Continuously replicates /data/censurado.db (snapshots + WAL frames) to a
  # replica. By default that is the local "replica-data" volume (a file replica,
  # no credentials). For off-site backups, set the LITESTREAM_S3_* vars in .env
  # and uncomment the s3 block in litestream.yml.
  #
  # Single-writer is preserved: litestream only READS article data to replicate it.
  # It never inserts/updates rows, so publish remains the sole writer. It does hold
  # a read lock and manage the WAL, which is why db-data is mounted read-write (a
  # ":ro" mount cannot touch the -wal/-shm sidecars), exactly like admin/generate.
  #
  # Why this runs as root (unlike the nonroot publish/admin/generate): it shares the
  # WAL index (-shm/-wal) on db-data with the nonroot publish writer (uid 65532) AND
  # writes a fresh replica-data volume that Docker initializes root-owned. Running as
  # root lets it read/write both without an ownership clash. depends_on publish so
  # publish opens the db and creates the 65532-owned -wal/-shm first; litestream then
  # coexists. It is still cap-dropped, no-new-privileges, and read-only-rootfs, so the
  # post-compromise blast radius stays small.
  litestream:
    image: litestream/litestream:0.3.14@sha256:c5a1e1b01916b3a110f6600820ef176d048d9b9c2411ef0a680de0caa68934a5
    restart: unless-stopped
    # depends_on so publish initializes the db-data volume and creates the WAL
    # sidecars (owned by uid 65532) before litestream attaches.
    depends_on:
      - publish
    # Carries the LITESTREAM_S3_* vars for the optional s3 replica. The file replica
    # needs none; with the s3 block commented these are simply unused.
    env_file: .env
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      # Read the live db + WAL to replicate. Read-write because WAL/-shm access
      # requires it; litestream never writes article rows (single-writer intact).
      - db-data:/data
      # Local file replica target (snapshots + WAL). Swap for / add s3 in prod.
      - replica-data:/replica
      - ./litestream.yml:/etc/litestream.yml:ro
    # Hardened like the other services: no Linux capabilities, no privilege
    # escalation, read-only root filesystem with a tmpfs for scratch.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # The single sqlite database (WAL): written by publish, read by admin/generate.
  db-data:
  # The generated static site: written by generate (and admin regenerate), served
  # by an external CDN/web server outside this compose.
  site-data:
  # The self-hosted image store: uploaded images written by publish, served at
  # /media/ by publish AND by the external web server (which mounts it read-only).
  # Litestream backs up only the sqlite db, so back this volume up separately.
  media-data:
  # Local file-replica target for the litestream backup sidecar (snapshots + WAL).
  # In production this can be the staging replica alongside an off-site s3 replica.
  replica-data:
